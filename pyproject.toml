[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-sss"
version = "0.1.2"
description = "SJTU study-material collection toolkit"
readme = "README.md"
requires-python = ">=3.11.8"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "py7zr>=1.0,<2", "rarfile>=4.2,<5", "markdownify>=1.2,<2", "markdown>=3.6,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
desktop = ["sjtu-sss[web]", "pywebview>=6,<7", "pyperclip>=1.9,<2"]
build = ["sjtu-sss[desktop]", "pyinstaller>=6.16,<7", "pillow>=11,<13"]

[project.scripts]
sss = "sss.cli:main"
sss-desktop = "sss.desktop:main"

[tool.setuptools.packages.find]
include = ["sss*"]

[tool.setuptools.package-data]
sss = ["web_static/*", "web_static/assets/*", "study_resources/*.md"]
